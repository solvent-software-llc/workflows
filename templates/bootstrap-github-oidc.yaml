AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time per-account bootstrap: GitHub Actions OIDC provider + scoped deploy role.
  Run manually with an admin credential. Never invoked from CI.
#
#   aws cloudformation deploy \
#     --template-file templates/bootstrap-github-oidc.yaml \
#     --stack-name solvent-bootstrap \
#     --region us-east-1 \
#     --parameter-overrides GitHubOrg=... RepoName=... ClientSlug=... \
#     --capabilities CAPABILITY_NAMED_IAM

Parameters:
  GitHubOrg:
    Type: String
  RepoName:
    Type: String
  ClientSlug:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
  DeployBranch:
    Type: String
    Default: main
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Only one OIDC provider per URL can exist per AWS account. Set false if
      another stack in this account already created it.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # No longer validated by AWS for well-known IdPs, retained for compatibility.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'github-deploy-${ClientSlug}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${RepoName}:ref:refs/heads/${DeployBranch}'
      Policies:
        - PolicyName: site-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/*/*'
              - Sid: CloudFormationValidate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: S3Site
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration      # required by the new lifecycle rules
                  - s3:GetLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  # Scoped to this client's bucket only, not a wildcard suffix match.
                  - !Sub 'arn:aws:s3:::${ClientSlug}-site-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ClientSlug}-site-${AWS::AccountId}/*'
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:TagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'
              - Sid: ACM
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                  - acm:DeleteCertificate
                Resource: '*'
              - Sid: Route53
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                Resource: '*'

Outputs:
  RoleArn:
    Description: Set this as the AWS_ROLE_ARN repository variable in the client repo
    Value: !GetAtt DeployRole.Arn
