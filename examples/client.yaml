# Committed configuration for this client. Nothing here is secret.
slug: client-name # resource naming token: lowercase, hyphens, 3-32 chars
name: Client Name # human-readable, used for AWS cost-allocation tags
tier: static-site
domain: client-name.com
www: true # false for subdomain sites like app.client-name.com

aws:
  region: us-east-1 # must be us-east-1 for the static tier (ACM/CloudFront)
  stack_name: client-name-site
  hosted_zone_id: XXXXXXXXXXX
  # bucket_name_override: client-name.com-site   # only for pre-convention stacks

# Optional. Serves the preview.yml workflow's builds from <subdomain>.<domain>,
# out of the same bucket/distribution/cert as production. Omit to disable.
# First enabling this replaces the ACM cert (new SAN) and briefly re-validates
# via DNS — expect a few minutes of cert reissuance on that one deploy.
# preview:
#   subdomain: preview

# Baked into the bundle at build time — public by definition, never secrets.
# Omit any key the site doesn't use.
public_env:
  PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
  PUBLIC_WEB3FORMS_ACCESS_KEY: 00000000-0000-0000-0000-000000000000
