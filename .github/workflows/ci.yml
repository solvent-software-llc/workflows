name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML is parseable
        run: |
          fail=0
          while read -r f; do
            yq -e '.' "$f" > /dev/null 2>&1 || { echo "::error file=$f::invalid YAML"; fail=1; }
          done < <(find . -path ./.git -prune -o \( -name '*.yml' -o -name '*.yaml' \) -print)
          exit $fail

      - name: Lint CloudFormation
        run: pipx run cfn-lint templates/*.yaml

      - name: Lint workflows
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Lint composite action shell
        run: |
          yq -r '.runs.steps[].run' .github/actions/client-config/action.yml \
            | shellcheck -s bash -

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No dangling action outputs
        run: |
          yq -r '.outputs | keys | .[]' .github/actions/client-config/action.yml | sort -u > /tmp/declared
          grep -rhoE 'steps\.cfg\.outputs\.[a-zA-Z0-9_]+' .github/workflows/ \
            | sed 's/.*outputs\.//' | sort -u > /tmp/referenced
          dangling=$(comm -13 /tmp/declared /tmp/referenced | tr '\n' ' ')
          if [ -n "${dangling// /}" ]; then
            echo "::error::workflows reference undeclared outputs: $dangling"
            exit 1
          fi

      - name: Referenced paths exist
        run: |
          fail=0
          while read -r p; do
            [ -e "$p" ] || { echo "::error::workflows reference .solvent/$p which does not exist"; fail=1; }
          done < <(grep -rhoE '\.solvent/[A-Za-z0-9._/-]+' .github/workflows/ \
            | sed -e 's|^\.solvent/||' -e 's|/\*.*||' | sort -u)
          exit "$fail"

      # Both workflows must build with identical env, or validate passes things
      # deploy rejects (and vice versa).
      - name: Workflows stay in sync
        run: |
          for w in static-site-deploy static-site-validate; do
            grep -q 'client-config' ".github/workflows/$w.yml" \
              || { echo "::error::$w.yml does not use the client-config action"; exit 1; }
          done
          if grep -nE '^\s+PUBLIC_[A-Z0-9_]+:' .github/workflows/*.yml; then
            echo "::error::PUBLIC_* belongs in client.yaml public_env, not a workflow env: block"
            exit 1
          fi

      # Context values spliced inline into run: are parsed by bash before
      # execution. Multi-line or space-containing values break the script;
      # attacker-controlled ones execute. Pass them through env: instead.
      - name: No context interpolation inside run blocks
        continue-on-error: true
        run: |
          if grep -rnE '\$\{\{ *(steps|inputs|matrix|github)\.' .github/workflows/*.yml \
               | grep -E '^\S+:[0-9]+:\s{10,}'; then
            echo "::error::pass context values through env:, not inline in run:"
            exit 1
          fi

      - name: Example pins a ref that exists
        run: |
          REF=$(grep -oE 'workflows/\.github/workflows/[^@]+@(.+)$' examples/deploy.yml | sed 's/.*@//')
          git ls-remote --exit-code --tags origin "refs/tags/$REF" > /dev/null \
            || { echo "::error::examples pin @$REF but no such tag exists"; exit 1; }

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Example config is valid
        id: cfg
        uses: ./.github/actions/client-config
        with:
          config-path: examples/client.yaml

      # toJSON emits multi-line JSON. Inline ${{ }} splices it in before bash
      # parses the script, so it must be passed through env:.
      - name: Outputs are populated
        env:
          OUTPUTS: ${{ toJSON(steps.cfg.outputs) }}
        run: |
          fail=0
          for o in slug name domain region stack zone www; do
            if [ -z "$(printf '%s' "$OUTPUTS" | jq -r --arg k "$o" '.[$k] // ""')" ]; then
              echo "::error::output '$o' is empty"; fail=1
            fi
          done
          echo "--- generated .env ---"; cat .env
          exit "$fail"

      - name: www:false survives parsing
        run: |
          cat > /tmp/sub.yaml <<'EOF'
          slug: acme-corp
          domain: app.acmecorp.com
          www: false
          aws: { region: us-east-1, stack_name: acme-corp-site, hosted_zone_id: Z123 }
          EOF
          cp /tmp/sub.yaml ./sub.yaml

      - id: sub
        uses: ./.github/actions/client-config
        with:
          config-path: sub.yaml
          write-env: 'false'
      - name: www must be false
        env:
          WWW: ${{ steps.sub.outputs.www }}
        run: |
          [ "$WWW" = "false" ] \
            || { echo "::error::www:false parsed as '$WWW'"; exit 1; }

  reject-bad-config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [missing-zone, bad-slug, wrong-tier, subdomain-with-www, bad-env-prefix]
    steps:
      - uses: actions/checkout@v4
      - name: Write invalid config
        env:
          CASE: ${{ matrix.case }}
        run: |
          case "$CASE" in
            missing-zone)
              printf 'slug: a-b\ndomain: a.com\naws: { region: us-east-1, stack_name: s }\n' > bad.yaml ;;
            bad-slug)
              printf 'slug: Acme_Corp\ndomain: a.com\naws: { region: us-east-1, stack_name: s, hosted_zone_id: Z1 }\n' > bad.yaml ;;
            wrong-tier)
              printf 'slug: a-b\ntier: fullstack\ndomain: a.com\naws: { region: us-east-1, stack_name: s, hosted_zone_id: Z1 }\n' > bad.yaml ;;
            subdomain-with-www)
              printf 'slug: a-b\ndomain: app.a.com\nwww: true\naws: { region: us-east-1, stack_name: s, hosted_zone_id: Z1 }\n' > bad.yaml ;;
            bad-env-prefix)
              printf 'slug: a-b\ndomain: a.com\naws: { region: us-east-1, stack_name: s, hosted_zone_id: Z1 }\npublic_env: { GA_ID: x }\n' > bad.yaml ;;
          esac
      - id: run
        continue-on-error: true
        uses: ./.github/actions/client-config
        with:
          config-path: bad.yaml
      - name: Must have failed
        env:
          OUTCOME: ${{ steps.run.outcome }}
          CASE: ${{ matrix.case }}
        run: |
          [ "$OUTCOME" = "failure" ] \
            || { echo "::error::$CASE was accepted but should be rejected"; exit 1; }
