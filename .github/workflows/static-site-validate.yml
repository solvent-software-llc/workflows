name: Static site validate

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: client.yaml
      node-version:
        required: false
        type: string
        default: '22'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve workflows repo ref
        id: wfref
        run: |
          REF="${{ github.job_workflow_ref }}"
          echo "ref=${REF##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: solvent-software-llc/workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: .solvent

      - name: Validate client.yaml
        run: |
          F="${{ inputs.config-path }}"
          test -f "$F" || { echo "::error::$F not found"; exit 1; }
          for key in client domain aws.region aws.stack_name aws.hosted_zone_id; do
            val=$(yq -r ".$key // \"\"" "$F")
            if [ -z "$val" ]; then echo "::error::missing required key: $key"; exit 1; fi
          done
          SLUG=$(yq -r '.client' "$F")
          echo "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$' \
            || { echo "::error::client slug must be lowercase alphanumeric + hyphens (S3 bucket naming)"; exit 1; }

      - name: Lint CloudFormation
        run: |
          pipx install cfn-lint
          cfn-lint .solvent/templates/*.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
