name: Static site validate

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: client.yaml
      node-version:
        required: false
        type: string
        default: '22'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve workflows repo ref
        id: wfref
        run: echo "ref=${GITHUB_JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: solvent-software-llc/workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: .solvent

      - name: Lint CloudFormation
        run: pipx run cfn-lint .solvent/templates/*.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - uses: ./.solvent/.github/actions/client-config
        id: cfg
        with:
          config-path: ${{ inputs.config-path }}

      - run: npm run check
      - run: npm run lint
      - run: npm run build
