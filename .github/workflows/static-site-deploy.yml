name: Static site deploy

on:
  workflow_call:
    inputs:
      aws-role-arn:
        description: IAM role ARN for the client account (from bootstrap stack output)
        required: true
        type: string
      config-path:
        description: Path to client.yaml in the calling repo
        required: false
        type: string
        default: client.yaml
      node-version:
        required: false
        type: string
        default: '22'
      deploy-target:
        description: >
          'production' syncs the build to the bucket root and serves it from
          the primary domain(s). 'preview' syncs to the preview/ prefix,
          served from client.yaml's preview.subdomain — the client.yaml must
          declare one.
        required: false
        type: string
        default: production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # job_workflow_ref resolves to the ref the CALLER pinned (e.g. .../static-site-deploy.yml@refs/tags/v1),
      # so the template is always version-locked to the workflow that uses it.
      - name: Resolve workflows repo ref
        id: wfref
        run: echo "ref=${GITHUB_JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout shared templates
        uses: actions/checkout@v4
        with:
          repository: solvent-software-llc/workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: .solvent

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - uses: ./.solvent/.github/actions/client-config
        id: cfg
        with:
          config-path: ${{ inputs.config-path }}

      - name: Validate deploy target
        if: inputs.deploy-target == 'preview'
        env:
          PREVIEW_DOMAIN: ${{ steps.cfg.outputs.preview_domain }}
        run: |
          if [ -z "$PREVIEW_DOMAIN" ]; then
            echo "::error::deploy-target is 'preview' but client.yaml has no preview.subdomain set"
            exit 1
          fi

      - run: npm run check
      - run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ steps.cfg.outputs.region }}
          role-skip-session-tagging: true

      # Config values come from client.yaml and are only checked for
      # non-emptiness, so they go through env: rather than being spliced into
      # the script by ${{ }} before bash parses it.
      - name: Deploy infrastructure
        env:
          STACK: ${{ steps.cfg.outputs.stack }}
          SLUG: ${{ steps.cfg.outputs.slug }}
          NAME: ${{ steps.cfg.outputs.name }}
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          ZONE: ${{ steps.cfg.outputs.zone }}
          WWW: ${{ steps.cfg.outputs.www }}
          BUCKET_OVERRIDE: ${{ steps.cfg.outputs.bucket_override }}
          PREVIEW_DOMAIN: ${{ steps.cfg.outputs.preview_domain }}
        run: |
          aws cloudformation deploy \
            --template-file .solvent/templates/static-site.yaml \
            --stack-name "$STACK" \
            --parameter-overrides \
              ClientSlug="$SLUG" \
              DomainName="$DOMAIN" \
              HostedZoneId="$ZONE" \
              CreateWww="$WWW" \
              BucketNameOverride="$BUCKET_OVERRIDE" \
              PreviewDomainName="$PREVIEW_DOMAIN" \
            --tags \
              solvent:client="$NAME" \
              solvent:slug="$SLUG" \
              solvent:managed-by=workflows \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        env:
          STACK: ${{ steps.cfg.outputs.stack }}
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output json)
          BUCKET=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          DIST=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue')
          if [ -z "$BUCKET" ] || [ -z "$DIST" ]; then
            echo "::error::stack did not return BucketName and DistributionId"; exit 1
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      # preview builds land under a preview/ key prefix in the same bucket, routed by
      # the distribution's PreviewRoutingFunction — see static-site.yaml. Production
      # is unprefixed, unchanged from before deploy-target existed.
      - name: Resolve key prefix
        id: prefix
        env:
          TARGET: ${{ inputs.deploy-target }}
        run: |
          if [ "$TARGET" = "preview" ]; then
            echo "prefix=preview/" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=" >> "$GITHUB_OUTPUT"
          fi

      # Content-hashed assets go first so freshly-deployed HTML never references a chunk
      # that hasn't landed. No --delete: a client holding the previous index.html still
      # needs the old chunks. The bucket lifecycle rule expires them after 30 days.
      - name: Sync immutable assets
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          aws s3 sync ./build/_app/immutable "s3://$BUCKET/${PREFIX}_app/immutable" \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=31536000,immutable'

      # Stable filenames must revalidate on every visit. --delete here so the bucket
      # mirrors the build exactly. Scoped to the prefix so a preview sync's --delete
      # never touches production objects (or vice versa) in the shared bucket.
      - name: Sync unversioned files
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          aws s3 sync ./build "s3://$BUCKET/$PREFIX" \
            --delete \
            --exclude '_app/immutable/*' \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        env:
          DIST: ${{ steps.stack.outputs.dist }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths "/${PREFIX}" "/${PREFIX}index.html" "/${PREFIX}404.html" "/${PREFIX}version.json"

      - name: Summary
        env:
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          PREVIEW_DOMAIN: ${{ steps.cfg.outputs.preview_domain }}
          TARGET: ${{ inputs.deploy-target }}
          STACK: ${{ steps.cfg.outputs.stack }}
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DIST: ${{ steps.stack.outputs.dist }}
        run: |
          if [ "$TARGET" = "preview" ]; then
            URL="https://$PREVIEW_DOMAIN"
          else
            URL="https://$DOMAIN"
          fi
          {
            echo "### Deployed $URL"
            echo "- Stack: \`$STACK\`"
            echo "- Bucket: \`$BUCKET\`"
            echo "- Distribution: \`$DIST\`"
          } >> "$GITHUB_STEP_SUMMARY"
