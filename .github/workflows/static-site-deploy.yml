name: Static site deploy

on:
  workflow_call:
    inputs:
      aws-role-arn:
        description: IAM role ARN for the client account (from bootstrap stack output)
        required: true
        type: string
      config-path:
        description: Path to client.yaml in the calling repo
        required: false
        type: string
        default: client.yaml
      node-version:
        required: false
        type: string
        default: '22'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # job_workflow_ref resolves to the ref the CALLER pinned (e.g. .../static-site-deploy.yml@refs/tags/v1),
      # so the template is always version-locked to the workflow that uses it.
      - name: Resolve workflows repo ref
        id: wfref
        run: echo "ref=${GITHUB_JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout shared templates
        uses: actions/checkout@v4
        with:
          repository: solvent-software-llc/workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: .solvent

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - uses: ./.solvent/.github/actions/client-config
        id: cfg
        with:
          config-path: ${{ inputs.config-path }}

      - run: npm run check
      - run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ steps.cfg.outputs.region }}
          role-skip-session-tagging: true

      - name: Deploy infrastructure
        run: |
          aws cloudformation deploy \
            --template-file .solvent/templates/static-site.yaml \
            --stack-name "${{ steps.cfg.outputs.stack }}" \
            --parameter-overrides \
              ClientSlug="${{ steps.cfg.outputs.slug }}" \
              DomainName="${{ steps.cfg.outputs.domain }}" \
              HostedZoneId="${{ steps.cfg.outputs.zone }}" \
              CreateWww="${{ steps.cfg.outputs.www }}" \
              BucketNameOverride="${{ steps.cfg.outputs.bucket_override }}" \
            --tags \
              solvent:client="${{ steps.cfg.outputs.slug }}" \
              solvent:managed-by=workflows \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        run: |
          read -r BUCKET DIST <<< "$(aws cloudformation describe-stacks \
            --stack-name '${{ steps.cfg.outputs.stack }}' \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'||OutputKey=='DistributionId'] | \
                     [?OutputKey=='BucketName'].OutputValue | [0]" --output text) \
            $(aws cloudformation describe-stacks \
            --stack-name '${{ steps.cfg.outputs.stack }}' \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" --output text)"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      # Content-hashed assets go first so freshly-deployed HTML never references a chunk
      # that hasn't landed. No --delete: a client holding the previous index.html still
      # needs the old chunks. The bucket lifecycle rule expires them after 30 days.
      - name: Sync immutable assets
        run: |
          aws s3 sync ./build/_app/immutable \
            "s3://${{ steps.stack.outputs.bucket }}/_app/immutable" \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=31536000,immutable'

      # Stable filenames must revalidate on every visit. --delete here so the bucket
      # mirrors the build exactly.
      - name: Sync unversioned files
        run: |
          aws s3 sync ./build "s3://${{ steps.stack.outputs.bucket }}" \
            --delete \
            --exclude '_app/immutable/*' \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.dist }}" \
            --paths '/' '/index.html' '/404.html' '/version.json'

      - name: Summary
        run: |
          {
            echo "### Deployed https://${{ steps.cfg.outputs.domain }}"
            echo "- Stack: \`${{ steps.cfg.outputs.stack }}\`"
            echo "- Bucket: \`${{ steps.stack.outputs.bucket }}\`"
            echo "- Distribution: \`${{ steps.stack.outputs.dist }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
